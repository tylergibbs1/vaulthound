name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          cd VaulthoundKit
          swift test

      - name: Build app (Release)
        run: |
          xcodebuild -project Vaulthound.xcodeproj \
            -scheme Vaulthound \
            -configuration Release \
            -archivePath build/Vaulthound.xcarchive \
            archive \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build CLI (Release)
        run: |
          xcodebuild -project Vaulthound.xcodeproj \
            -scheme vaulthound-cli \
            -configuration Release \
            -derivedDataPath build/cli \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          mkdir -p dist
          cp -R build/Vaulthound.xcarchive/Products/Applications/Vaulthound.app dist/
          cd dist
          zip -r -y Vaulthound-macOS.zip Vaulthound.app

      - name: Package CLI
        run: |
          mkdir -p dist
          cp build/cli/Build/Products/Release/vaulthound dist/
          cd dist
          tar czf vaulthound-cli-macOS.tar.gz vaulthound

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        id: sha
        run: |
          echo "app_sha=$(shasum -a 256 dist/Vaulthound-macOS.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "cli_sha=$(shasum -a 256 dist/vaulthound-cli-macOS.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Vaulthound v${{ steps.version.outputs.version }}
          body: |
            ## Vaulthound v${{ steps.version.outputs.version }}

            ### Install

            **Homebrew (recommended):**
            ```bash
            brew tap tylergibbs1/tap
            brew install --cask vaulthound
            ```

            **CLI only:**
            ```bash
            brew tap tylergibbs1/tap
            brew install vaulthound-cli
            ```

            **Manual download:**
            - `Vaulthound-macOS.zip` — the app (drag to /Applications)
            - `vaulthound-cli-macOS.tar.gz` — CLI binary only

            > First launch: right-click the app → Open to bypass Gatekeeper (not notarized yet).

            ### SHA256
            - App: `${{ steps.sha.outputs.app_sha }}`
            - CLI: `${{ steps.sha.outputs.cli_sha }}`

            ### Update Homebrew tap
            Run this after the release to update the tap formulas:
            ```bash
            cd /path/to/homebrew-tap
            sed -i '' 's/sha256 ".*"/sha256 "${{ steps.sha.outputs.app_sha }}"/' Casks/vaulthound.rb
            sed -i '' 's/version ".*"/version "${{ steps.version.outputs.version }}"/' Casks/vaulthound.rb
            sed -i '' 's/sha256 ".*"/sha256 "${{ steps.sha.outputs.cli_sha }}"/' Formula/vaulthound-cli.rb
            sed -i '' 's/version ".*"/version "${{ steps.version.outputs.version }}"/' Formula/vaulthound-cli.rb
            git commit -am "Update to v${{ steps.version.outputs.version }}" && git push
            ```
          files: |
            dist/Vaulthound-macOS.zip
            dist/vaulthound-cli-macOS.tar.gz
          draft: false
          prerelease: false

      - name: Update Homebrew tap
        if: ${{ secrets.TAP_GITHUB_TOKEN != '' }}
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          APP_SHA: ${{ steps.sha.outputs.app_sha }}
          CLI_SHA: ${{ steps.sha.outputs.cli_sha }}
        run: |
          git clone https://x-access-token:${TAP_TOKEN}@github.com/tylergibbs1/homebrew-tap.git /tmp/tap
          cd /tmp/tap

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/vaulthound.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${APP_SHA}\"/" Casks/vaulthound.rb

          sed -i '' "s|url \".*\"|url \"https://github.com/tylergibbs1/vaulthound/releases/download/v${VERSION}/vaulthound-cli-macOS.tar.gz\"|" Formula/vaulthound-cli.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${CLI_SHA}\"/" Formula/vaulthound-cli.rb
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Formula/vaulthound-cli.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || (git commit -m "Update to v${VERSION}" && git push)
