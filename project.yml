name: Vaulthound
options:
  bundleIdPrefix: com.vaulthound
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  VaulthoundKit:
    path: VaulthoundKit
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    from: "1.5.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Vaulthound:
    type: application
    platform: macOS
    sources:
      - VaulthoundApp
    dependencies:
      - package: VaulthoundKit
        product: VaulthoundModels
      - package: VaulthoundKit
        product: VaulthoundCore
      - package: VaulthoundKit
        product: VaulthoundSecurity
      - target: VaulthoundDaemon
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaulthound.app
        INFOPLIST_FILE: VaulthoundApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: VaulthoundApp/Vaulthound.entitlements
        ENABLE_HARDENED_RUNTIME: true
        PRODUCT_NAME: Vaulthound
        COMBINE_HIDPI_IMAGES: true
    info:
      path: VaulthoundApp/Info.plist
      properties:
        CFBundleDisplayName: Vaulthound
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: false
        NSHumanReadableCopyright: "Copyright © 2026 Vaulthound. All rights reserved."
    entitlements:
      path: VaulthoundApp/Vaulthound.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true

  VaulthoundDaemon:
    type: xpc-service
    platform: macOS
    sources:
      - VaulthoundDaemon
    dependencies:
      - package: VaulthoundKit
        product: VaulthoundModels
      - package: VaulthoundKit
        product: VaulthoundCore
      - package: VaulthoundKit
        product: VaulthoundSecurity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaulthound.app.daemon
        INFOPLIST_FILE: VaulthoundDaemon/Info.plist
        ENABLE_HARDENED_RUNTIME: true
        PRODUCT_NAME: VaulthoundDaemon
    info:
      path: VaulthoundDaemon/Info.plist
      properties:
        CFBundleIdentifier: com.vaulthound.app.daemon
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        XPCService:
          ServiceType: Application

  vaulthound-cli:
    type: tool
    platform: macOS
    sources:
      - vaulthound-cli
    dependencies:
      - package: VaulthoundKit
        product: VaulthoundModels
      - package: VaulthoundKit
        product: VaulthoundCore
      - package: VaulthoundKit
        product: VaulthoundSecurity
      - package: swift-argument-parser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: vaulthound
        ENABLE_HARDENED_RUNTIME: true

schemes:
  Vaulthound:
    build:
      targets:
        Vaulthound: all
        VaulthoundDaemon: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  vaulthound-cli:
    build:
      targets:
        vaulthound-cli: all
    run:
      config: Debug
